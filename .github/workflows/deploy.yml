name: Deploy para o Google Cloud Run

# Roda a cada push na main que toque no back-end ou no front-end, ou
# manualmente pela aba "Actions" do GitHub (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "back-end/**"
      - "front-end/app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

env:
  REGION: southamerica-east1 # São Paulo — troque se seu projeto GCP usar outra região
  AR_REPO: feelframe # nome do repositório no Artifact Registry (ver DEPLOY.md)
  BACKEND_SERVICE: feelframe-backend
  FRONTEND_SERVICE: feelframe-frontend

jobs:
  deploy-backend:
    name: Build & Deploy — Back-end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Autenticar Docker no Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build da imagem
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/backend:latest \
            ./back-end

      - name: Push da imagem
        run: docker push --all-tags ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/backend

      # Segredos reais (Mongo URI, chave JWT, client ID do Google, credencial
      # do Firebase) NÃO passam por aqui — eles já existem no Secret Manager
      # do GCP e são referenciados por nome via --set-secrets. Ver DEPLOY.md
      # para o passo a passo de criação desses secrets (comando `gcloud
      # secrets create`, executado uma única vez, manualmente).
      - name: Deploy no Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=4Gi \
            --cpu=2 \
            --timeout=600 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="DB_NAME=feelFrame,JWT_EXPIRE_HOURS=168,STORAGE_BACKEND=firebase,VIDEO_POOL_WORKERS=2,FIREBASE_CREDENTIALS_PATH=app/credentials/serviceAccountKey.json,FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
            --set-secrets="MONGO_URI=mongo-uri:latest,JWT_SECRET_KEY=jwt-secret:latest,GOOGLE_CLIENT_ID=google-client-id:latest,/app/app/credentials/serviceAccountKey.json=firebase-credentials:latest"

          echo "url=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Build & Deploy — Front-end
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Autenticar Docker no Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # A URL do back-end (gerada no job acima) e o Google Client ID são
      # "queimados" no bundle estático do React durante o `npm run build`
      # dentro do Dockerfile — por isso são passados como --build-arg.
      - name: Build da imagem
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ needs.deploy-backend.outputs.backend_url }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/frontend:latest \
            ./front-end/app

      - name: Push da imagem
        run: docker push --all-tags ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/frontend

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3

      - name: Mostrar URLs
        run: |
          echo "Back-end:  ${{ needs.deploy-backend.outputs.backend_url }}"
          echo "Front-end: $(gcloud run services describe ${{ env.FRONTEND_SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')"
